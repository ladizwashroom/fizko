<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Music Station</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0a0a12;
            overflow-x: hidden;
        }

        .cyber-shadow {
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.5), inset 0 0 10px rgba(255, 0, 128, 0.2);
        }
        .neon-glow-pink {
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f, 0 0 30px #ff007f;
        }
        .neon-glow-cyan {
            text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
        }

        @keyframes permanentGlow {
            0%, 100% { text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff, 0 0 40px #00f0ff; color: #00f0ff; }
            50% { text-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f, 0 0 50px #ff007f; color: #ff007f; }
        }
        .vertical-glow-text {
            writing-mode: vertical-rl;
            text-transform: uppercase;
            animation: permanentGlow 4s infinite ease-in-out;
        }

        .font-graffiti {
            font-family: 'Permanent Marker', cursive;
            text-shadow: 3px 3px 0px #ff007f;
        }

        #youtube-audio-player {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="text-white min-h-screen relative flex items-center justify-center p-4">

    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-purple-900/20 via-slate-950 to-black z-0"></div>

    <div id="youtube-audio-player"></div>

    <div class="container max-w-4xl w-full aspect-video bg-slate-900/60 border border-cyan-500/40 rounded-lg p-8 relative z-10 cyber-shadow backdrop-blur-md flex flex-col justify-between overflow-hidden">
        
        <nav class="absolute top-0 left-0 right-0 h-12 bg-black/80 border-b border-pink-500/30 flex items-center justify-between px-6 z-30 select-none pointer-events-none">
            <div class="text-xs text-pink-500 tracking-widest font-bold"><i class="fa-solid fa-microchip mr-2 animate-pulse"></i>SYSTEM: ACTIVE</div>
            <div class="flex gap-6 text-[10px] tracking-widest text-cyan-400 uppercase font-bold">
                <span>// CYBERPUNK</span>
                <span>// GRAFITI</span>
                <span>// MUSIC</span>
            </div>
            <div class="text-xs text-cyan-400">v1.5.0_PICO</div>
        </nav>

        <aside class="absolute left-0 top-12 bottom-0 w-16 bg-black/60 border-r border-cyan-500/30 flex flex-col items-center pt-6 z-20 select-none">
            <div class="flex flex-col gap-1.5 mb-8 cursor-pointer group p-2">
                <span class="w-6 h-0.5 bg-pink-500 group-hover:bg-cyan-400 transition-colors"></span>
                <span class="w-6 h-0.5 bg-pink-500 group-hover:bg-cyan-400 transition-colors"></span>
                <span class="w-4 h-0.5 bg-pink-500 group-hover:bg-cyan-400 transition-colors align-right"></span>
            </div>

            <div class="vertical-glow-text text-xl font-black tracking-widest mt-4">
                sh1t
            </div>
        </aside>

        <div class="ml-16 mt-12 flex-1 flex flex-col items-center justify-center gap-6 relative">
            
            <div class="w-full max-w-md bg-black/50 border border-pink-500/30 rounded p-4 text-center cyber-shadow">
                <div class="text-[10px] text-pink-400 uppercase tracking-widest mb-1">Now Streaming From Net</div>
                <div id="track-title" class="text-sm font-bold text-cyan-400 tracking-wide truncate">SYSTEM IDLE - WAITING FOR INPUT</div>
            </div>

            <div class="w-full max-w-sm flex flex-col gap-4">
                
                <div class="relative w-full cyber-shadow rounded-sm overflow-hidden">
                    <input type="text" id="search-input" placeholder="Paste YouTube Link or Video ID..." 
                        class="w-full bg-slate-950 border-0 py-3 pl-4 pr-12 text-sm text-cyan-400 focus:outline-none focus:ring-1 focus:ring-cyan-400 placeholder-slate-600">
                    <button id="search-btn" class="absolute right-0 top-0 bottom-0 px-4 bg-cyan-500/20 text-cyan-400 hover:bg-cyan-500 hover:text-black transition-all border-l border-cyan-500/30">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>

                <button id="play-btn" class="w-full py-4 bg-gradient-to-r from-pink-500 via-purple-600 to-cyan-500 text-black font-black uppercase tracking-widest rounded-none border-0 cyber-shadow transition-all duration-300 hover:scale-[1.02] hover:brightness-125 flex items-center justify-center gap-3">
                    <i id="play-icon" class="fa-solid fa-play text-lg"></i>
                    <span id="play-text">Initialize Audio</span>
                </button>

            </div>
        </div>

        <div class="absolute bottom-4 right-6 font-graffiti text-3xl text-cyan-400 tracking-wider select-none z-20">
            tulz
        </div>

    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var isPlaying = false;
        
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-audio-player', {
                height: '1',
                width: '1',
                videoId: 'dQw4w9WgXcQ',
                playerVars: {
                    'playsinline': 1,
                    'controls': 0,
                    'disablekb': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            document.getElementById('track-title').innerText = "AUDIO SYSTEM READY // READY TO LAUNCH";
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                isPlaying = false;
                updatePlayButton();
            }
        }

        function extractVideoId(url) {
            var regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            var match = url.match(regExp);
            return (match && match[2].length == 11) ? match[2] : url;
        }

        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const trackTitle = document.getElementById('track-title');

        function loadTargetMusic() {
            const rawInput = searchInput.value.trim();
            if(rawInput && player) {
                const videoId = extractVideoId(rawInput);
                player.cueVideoById(videoId);
                trackTitle.innerText = `LOADED ID: ${videoId} // PRESS PLAY TO STREAM`;
                isPlaying = false;
                updatePlayButton();
            }
        }

        searchBtn.addEventListener('click', loadTargetMusic);
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') loadTargetMusic();
        });

        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const playText = document.getElementById('play-text');

        playBtn.addEventListener('click', function() {
            if (!player) return;

            if (!isPlaying) {
                player.playVideo();
                isPlaying = true;
                trackTitle.innerText = "STREAMING AUDIO BACKGROUND OVERRIDE...";
            } else {
                player.pauseVideo();
                isPlaying = false;
                trackTitle.innerText = "STREAMING PAUSED // SYSTEM STANDBY";
            }
            updatePlayButton();
        });

        function updatePlayButton() {
            if (isPlaying) {
                playIcon.className = "fa-solid fa-pause text-lg";
                playText.innerText = "Halt Stream";
            } else {
                playIcon.className = "fa-solid fa-play text-lg";
                playText.innerText = "Execute Stream";
            }
        }
    </script>
</body>
</html>
